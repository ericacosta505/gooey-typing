<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eae7ef"><title>Gooey</title>
<meta name="description" content="A surreal, soft-body jelly keyboard. Type, squish, stretch, and let go.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%23f0a8c4'/%3E%3Cstop offset='1' stop-color='%23a1d6d7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='7' width='54' height='50' rx='22' fill='url(%23g)'/%3E%3Cpath d='M16 20Q30 10 45 19' fill='none' stroke='white' stroke-opacity='.8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="./app.js"></script>
</head>
<body>
<main class="experience" id="experience">
  <div class="typing" id="typing-area">
    <div id="passage" class="passage" aria-hidden="true"></div>
    <textarea id="typing-input" aria-label="Type the passage. Your first character starts the session." aria-describedby="accessible-passage" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="next"></textarea>
    <span class="sr-only" id="accessible-passage"></span>
  </div>
  <div class="stage" id="keyboard"></div>
  <div class="actions">
    <div class="buttons"><button id="start" class="start">Start</button><button id="stop" class="stop" disabled>Stop</button></div>
    <output id="result" aria-live="polite"></output>
  </div>
  <span class="sr-only" id="announcement" role="status">Start typing, or press Start. You can also hold and drag the 3D keys to stretch them.</span>
</main>
</body>
</html>
